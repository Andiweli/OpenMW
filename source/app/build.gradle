apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

/*
 * OpenMW 0.51.0 Android final release baseline
 *
 * Keeps the tested ARM64 runtime, Android launcher settings, shadows and
 * calibrated OMWFX chain together behind one build-time verification gate.
 */

def openMwVersionCode = 5100
def versionFile = new File(
        project.rootDir,
        'app/src/main/assets/libopenmw/resources/version'
)

def calculateVersion = {
    def engineVersion = 'openmw-native-not-built'

    if (versionFile.isFile()) {
        def firstLine = versionFile.readLines().find { line -> !line.trim().isEmpty() }
        if (firstLine != null) {
            engineVersion = firstLine.trim()
        }
    }

    return engineVersion
}

// The final release deliberately supports ARM64 only.
// The original native build creates one ABI at a time; advertising x86/ARM32
// while only libopenmw.so for ARM64 exists would produce installable but broken APKs.
def requiredOpenMwPayload = [
        file('src/main/assets/libopenmw/resources/version'),
        file('src/main/assets/libopenmw/resources/shaders/compatibility/fullscreen_tri.vert'),
        file('src/main/assets/libopenmw/resources/shaders/compatibility/shadowcasting.vert'),
        file('src/main/assets/libopenmw/resources/shaders/compatibility/shadows_fragment.glsl'),
        file('src/main/assets/libopenmw/resources/shaders/compatibility/water.frag'),
        file('src/main/assets/libopenmw/resources/shaders/compatibility/debug.vert'),
        file('src/main/assets/libopenmw/resources/shaders/compatibility/debug.frag'),
        file('src/main/assets/libopenmw/resources/vfs/shaders/adjustments.omwfx'),
        file('src/main/assets/android_omwfx/gateh_bloom051.omwfx'),
        file('src/main/assets/android_omwfx/godrays_android_051_depthfixed_vivid.omwfx'),
        file('src/main/assets/android_omwfx/lensflare_android_051_rayocc.omwfx'),
        file('src/main/assets/android_omwfx/rainlens_android_051_v12_dense.omwfx'),
        file('src/main/assets/android_omwfx/wetworld_android_051_weather.omwfx'),
        file('src/main/assets/libopenmw/openmw/defaults.bin'),
        file('src/main/assets/libopenmw/openmw/openmw.base.cfg'),
        file('src/main/assets/libopenmw/openmw/openmw-engine-version.txt'),
        file('src/main/assets/libopenmw/openmw/gamecontrollerdb.txt'),
        file('src/main/assets/libopenmw/3rdparty-licenses.txt'),

        file('src/main/java/ui/activity/MainActivity.kt'),
        file('src/main/java/ui/fragments/FragmentSettings.kt'),
        file('src/main/res/xml/settings.xml'),
        file('src/main/res/xml/gs_engine.xml'),
        file('src/main/res/values/strings.xml'),

        file('src/main/jniLibs/arm64-v8a/libopenmw.so'),
        file('src/main/jniLibs/arm64-v8a/libopenal.so'),
        file('src/main/jniLibs/arm64-v8a/libSDL2.so'),
        file('src/main/jniLibs/arm64-v8a/libGL.so'),
        file('src/main/jniLibs/arm64-v8a/libcollada-dom2.5-dp.so'),
        file('src/main/jniLibs/arm64-v8a/libc++_shared.so')
]

tasks.register('verifyOpenMwPayload') {
    group = 'verification'
    description = 'Checks the consolidated OpenMW 0.51.0 Android final release payload.'

    doLast {
        def missing = requiredOpenMwPayload.findAll { !it.exists() }
        if (!missing.isEmpty()) {
            def relativeMissing = missing.collect {
                project.rootDir.toPath().relativize(it.toPath()).toString()
            }.join('\n - ')

            throw new GradleException(
                    'OpenMW 0.51 runtime payload is missing.\n' +
                    'Build it first with tools\\build-openmw-051-runtime.ps1.\n\n' +
                    'Missing files:\n - ' + relativeMissing
            )
        }

        def engineMarkerFile = file('src/main/assets/libopenmw/openmw/openmw-engine-version.txt')
        def engineMarker = engineMarkerFile.getText('UTF-8').replace('\r\n', '\n').trim()
        def requiredFinalCommit = 'f4bec41444214a7903bebd178389ca22ca13f646'
        def expectedEngineMarker = 'OpenMW 0.51.0 Final\ncommit=' + requiredFinalCommit

        if (engineMarker != expectedEngineMarker) {
            def printableMarker = engineMarker.replace('\n', ' | ')
            throw new GradleException(
                    'The native payload is not the pinned OpenMW 0.51.0 Final runtime gate.\n' +
                    'Run tools\\build-openmw-051-runtime.ps1 before assembling the APK.\n' +
                    'Expected marker: ' + expectedEngineMarker.replace('\n', ' | ') + '\n' +
                    'Actual marker:   ' + printableMarker
            )
        }

        // Keep the release-cleaned native build tied to its generated digest.
        def finalNativeShaFile = new File(project.rootDir, 'buildscripts/openmw-051-patch39-libopenmw.sha256')
        if (!finalNativeShaFile.isFile()) {
            throw new GradleException(
                    'OpenMW 0.51 Android requires the release-cleaned native library.\n' +
                    'Run tools\\apply-openmw-051-patch39-release-log-cleanup.ps1 before assembling the APK.'
            )
        }

        def expectedNativeSha = finalNativeShaFile.getText('UTF-8').trim().split(/\s+/)[0]
        def finalNativeLib = file('src/main/jniLibs/arm64-v8a/libopenmw.so')
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        finalNativeLib.withInputStream { input ->
            byte[] buffer = new byte[64 * 1024]
            int count
            while ((count = input.read(buffer)) > 0) {
                digest.update(buffer, 0, count)
            }
        }
        def actualNativeSha = digest.digest().collect { String.format('%02x', it & 0xff) }.join()
        if (!expectedNativeSha.equalsIgnoreCase(actualNativeSha)) {
            throw new GradleException(
                    'OpenMW 0.51 Android release native payload is stale.\n' +
                    'Run tools\\apply-openmw-051-patch39-release-log-cleanup.ps1 again.\n' +
                    'Expected SHA-256: ' + expectedNativeSha + '\n' +
                    'Actual SHA-256:   ' + actualNativeSha
            )
        }

        def resourceVersion = file('src/main/assets/libopenmw/resources/version')
                .getText('UTF-8').trim()
        if (!resourceVersion.startsWith('0.51.0')) {
            throw new GradleException(
                    'OpenMW resources are not from 0.51.0 Final. Actual resources/version: ' +
                    resourceVersion
            )
        }

        if (openMwVersionCode != 5100 || calculateVersion() != '0.51.0') {
            throw new GradleException(
                    'OpenMW Android final release identity must be versionName 0.51.0 and versionCode 5100.'
            )
        }

        def launcherMainActivity = file('src/main/java/ui/activity/MainActivity.kt').getText('UTF-8')
        if (!launcherMainActivity.contains('migrateOpenMw051SettingsPreferences()') ||
                !launcherMainActivity.contains('private fun controllerTriggerThresholds(): Pair<Int, Int>') ||
                !launcherMainActivity.contains('private fun applyOpenMw051LauncherSettings()') ||
                !launcherMainActivity.contains('private fun applyOpenMw051RuntimeSettings()') ||
                !launcherMainActivity.contains('OMWFX_RECOMMENDED_CHAIN.joinToString(",")') ||
                !launcherMainActivity.contains('"controller trigger press" to triggerPress.toString()') ||
                !launcherMainActivity.contains('"controller trigger release" to triggerRelease.toString()') ||
                !launcherMainActivity.contains('"point lighting" to if (groundcoverPointLighting) "true" else "false"') ||
                !launcherMainActivity.contains('"pref_omw051_controller_trigger_thresholds"') ||
                !launcherMainActivity.contains('"gs_groundcover_point_lighting"') ||
                !launcherMainActivity.contains('text = "ARM64 \\u2022 v${BuildConfig.VERSION_NAME}"') ||
                !launcherMainActivity.contains('OpenMW 0.51 Android release runtime:') ||
                launcherMainActivity.contains('Gate H5a') ||
                launcherMainActivity.indexOf('text = "ARM64 \\u2022 v${BuildConfig.VERSION_NAME}"') >
                    launcherMainActivity.indexOf('"This port by Andreas \\"Andiweli\\" Stürmer\\n"')) {
            throw new GradleException(
                    'OpenMW 0.51 Android launcher, OMWFX consolidation or About information is incomplete.'
            )
        }

        def launcherFragmentSettings = file('src/main/java/ui/fragments/FragmentSettings.kt').getText('UTF-8')
        if (!launcherFragmentSettings.contains('prepareControllerTriggerPreference()') ||
                !launcherFragmentSettings.contains('Custom ($triggerPress press, $triggerRelease release)') ||
                !launcherFragmentSettings.contains('sharedPref.getString("pref_shadersDir_v2", "") == "modified"')) {
            throw new GradleException(
                    'OpenMW 0.51 controller-trigger or shader-precision handling is missing.'
            )
        }

        def launcherSettingsXml = file('src/main/res/xml/settings.xml').getText('UTF-8')
        def controllerTooltipsIndex = launcherSettingsXml.indexOf('android:key="pref_omw050_controller_tooltips"')
        def controllerTriggerIndex = launcherSettingsXml.indexOf('android:key="pref_omw051_controller_trigger_thresholds"')
        def onScreenControlsIndex = launcherSettingsXml.indexOf('android:key="pref_controls"')
        def hideOnScreenButtonsIndex = launcherSettingsXml.indexOf('android:key="pref_hide_controls"')
        if (!launcherSettingsXml.contains('android:dependency="pref_omw050_controller_menus"') ||
                !launcherSettingsXml.contains('Use OpenMW 0.51 gamepad-optimized menu navigation') ||
                !launcherSettingsXml.contains('android:summary="@string/pref_nohighp_summary"') ||
                controllerTooltipsIndex < 0 ||
                controllerTriggerIndex <= controllerTooltipsIndex ||
                onScreenControlsIndex <= controllerTriggerIndex ||
                hideOnScreenButtonsIndex <= onScreenControlsIndex) {
            throw new GradleException(
                    'OpenMW 0.51 launcher order or precision explanation is missing from settings.xml.'
            )
        }

        def launcherEngineXml = file('src/main/res/xml/gs_engine.xml').getText('UTF-8')
        if (!launcherEngineXml.contains('android:key="gs_groundcover_point_lighting"') ||
                !launcherEngineXml.contains('android:defaultValue="true"')) {
            throw new GradleException(
                    'OpenMW 0.51 Groundcover point-lighting control is missing.'
            )
        }

        def launcherStrings = file('src/main/res/values/strings.xml').getText('UTF-8')
        ['30720,26624', '24576,20480', '16384,12288'].each { thresholdPreset ->
            if (!launcherStrings.contains('<item>' + thresholdPreset + '</item>')) {
                throw new GradleException(
                        'OpenMW 0.51 controller-trigger preset is missing: ' + thresholdPreset
                )
            }
        }
        if (!launcherStrings.contains('<string name="pref_nohighp_summary">Uses medium instead of high precision; available only with the Modified shader preset</string>')) {
            throw new GradleException(
                    'OpenMW 0.51 Medium shader precision explanation is missing.'
            )
        }

        def finalBloom = file('src/main/assets/android_omwfx/gateh_bloom051.omwfx')
                .getText('UTF-8')
        if (!finalBloom.contains('passes = nomipmap, horizontal, vertical, final;') ||
                !finalBloom.contains('internal_format = rgb16f;') ||
                !finalBloom.contains('source_type = half_float;') ||
                !finalBloom.contains('uniform_float uThreshold {\n    default = 0.30;') ||
                !finalBloom.contains('uniform_float uSkyFactor {\n    default = 0.60;') ||
                !finalBloom.contains('uniform_float uRadius {\n    default = 0.55;') ||
                !finalBloom.contains('uniform_float uStrength {\n    default = 0.35;')) {
            throw new GradleException(
                'OpenMW 0.51 Android requires the calibrated four-pass Bloom shader.'
            )
        }

        def finalLensflare = file('src/main/assets/android_omwfx/lensflare_android_051_rayocc.omwfx')
                .getText('UTF-8')
        if (!finalLensflare.contains('vec4 viewDir = omw.viewMatrix * vec4(discDir, 0.0);') ||
                !finalLensflare.contains('omw.sunVis * clamp(omw.sunOcclusion, 0.0, 1.0) * edgeFade051(sunUv)') ||
                finalLensflare.contains('sunOcclusion(') ||
                finalLensflare.contains('sunOcclusion051(') ||
                finalLensflare.contains('omw_GetLinearDepth(') ||
                finalLensflare.contains('omw_GetDepth(') ||
                finalLensflare.contains('Disable_SunGlare') ||
                !finalLensflare.contains('version = "2.1-051-rayocc";')) {
            throw new GradleException(
                'OpenMW 0.51 Android requires the CPU-ray-occluded Lensflare shader.'
            )
        }

        def finalGodrays = file('src/main/assets/android_omwfx/godrays_android_051_depthfixed_vivid.omwfx')
                .getText('UTF-8')
        if (!finalGodrays.contains('uniform_float ray_strength {\n    default = 0.60;') ||
                !finalGodrays.contains('uniform_float ray_length {\n    default = 0.85;') ||
                !finalGodrays.contains('uniform_float sun_glow_strength {\n    default = 0.65;') ||
                !finalGodrays.contains('uniform_float direct_glare_strength {\n    default = 0.48;') ||
                !finalGodrays.contains('vec4 viewDir = omw.viewMatrix * vec4(discDir, 0.0);') ||
                !finalGodrays.contains('clamp(omw.sunOcclusion, 0.0, 1.0)') ||
                !finalGodrays.contains('float depth = omw_GetDepth(clamp(uv, vec2(0.001), vec2(0.999)));') ||
                !finalGodrays.contains('return smoothstep(0.99970, 0.99999, depth);') ||
                !finalGodrays.contains('float shaftContrast = smoothstep(0.08, 0.92, shafts);') ||
                !finalGodrays.contains('shafts = mix(shafts, shaftContrast, 0.35);') ||
                !finalGodrays.contains('light += warmColor * shaftIntensity * 0.78;') ||
                !finalGodrays.contains('light += sunColor * directSun * direct_glare_strength * 0.60 * glowVisibility;') ||
                finalGodrays.contains('direct_glare_strength * 0.80 * glowVisibility;') ||
                !finalGodrays.contains('float directSun = 1.0 - smoothstep(0.035, 0.48, centerDistance);') ||
                !finalGodrays.contains('for (int i = 0; i < 16; i += 1)') ||
                finalGodrays.contains('omw_GetLinearDepth(') ||
                finalGodrays.contains('Disable_SunGlare') ||
                !finalGodrays.contains('version = "3.4-051-depthfixed-vivid-softglare";')) {
            throw new GradleException(
                    'OpenMW 0.51 Android requires the dynamic 16-tap Tex_Depth Godrays with 75-percent Direct Sun Glare.'
            )
        }

        def finalRainLens = file('src/main/assets/android_omwfx/rainlens_android_051_v12_dense.omwfx')
                .getText('UTF-8')
        if (!finalRainLens.contains('uniform_float rainlens_strength_v34 {\n    default = 0.72;') ||
                !finalRainLens.contains('uniform_float rainlens_refraction_v34 {\n    default = 0.92;') ||
                !finalRainLens.contains('uniform_float rainlens_density_v34 {\n    default = 0.90;') ||
                !finalRainLens.contains('float hash21051(vec2 p)') ||
                !finalRainLens.contains('vec4 movingDrop051(') ||
                !finalRainLens.contains('p.y += timeValue * speed;') ||
                !finalRainLens.contains('float timeValue = omw.simulationTime;') ||
                !finalRainLens.contains('float currentRain = rainForWeather051(omw.weatherID);') ||
                !finalRainLens.contains('float nextRain = rainForWeather051(omw.nextWeatherID);') ||
                !finalRainLens.contains('clamp(omw.weatherTransition, 0.0, 1.0)') ||
                !finalRainLens.contains('vec4 drop = movingDrop051(') ||
                !finalRainLens.contains('omw_TexCoord, 5.6, 0.215, 19.7, timeValue, wind, density') ||
                !finalRainLens.contains('float threshold = mix(0.94, 0.72, clamp(density, 0.0, 1.0));') ||
                !finalRainLens.contains('float refractionMix = clamp(mask * 0.82, 0.0, 0.82);') ||
                !finalRainLens.contains('result += vec3(0.028) * drop.w * rain;') ||
                !finalRainLens.contains('flags = Disable_Interiors, Disable_Underwater;') ||
                !finalRainLens.contains('version = "4.3-051-rainlens-v12-dense";') ||
                finalRainLens.contains('omw.simulationTime * 0.001') ||
                finalRainLens.contains('rainHash3051(') ||
                finalRainLens.contains('teardropLayer051(') ||
                finalRainLens.contains('omw_GetDepth(') ||
                finalRainLens.contains('omw_GetLinearDepth(')) {
            throw new GradleException(
                    'OpenMW 0.51 Android requires RainLens v1.2 geometry with the doubled drop population.'
            )
        }

        def finalWetWorld = file('src/main/assets/android_omwfx/wetworld_android_051_weather.omwfx')
                .getText('UTF-8')
        if (!finalWetWorld.contains('uniform_float wet_strength_v35 {\n    default = 0.92;') ||
                !finalWetWorld.contains('uniform_float wet_darkening_v35 {\n    default = 0.30;') ||
                !finalWetWorld.contains('uniform_float wet_sheen_v35 {\n    default = 0.34;') ||
                !finalWetWorld.contains('uniform_float puddle_strength_v35 {\n    default = 0.62;') ||
                !finalWetWorld.contains('float rainFactor051()') ||
                !finalWetWorld.contains('float valueNoise051(vec2 p)') ||
                !finalWetWorld.contains('vec3 reconstructedWorldNormal051(vec2 uv)') ||
                !finalWetWorld.contains('float upFacing = smoothstep(0.30, 0.76, abs(n.z));') ||
                !finalWetWorld.contains('float puddleMask = smoothstep(0.56, 0.76, puddleField)') ||
                !finalWetWorld.contains('if (base.a < 0.25)') ||
                !finalWetWorld.contains('flags = Disable_Interiors, Disable_Underwater;') ||
                !finalWetWorld.contains('version = "5.0-051-weather-puddles";') ||
                finalWetWorld.contains('dFdx(') ||
                finalWetWorld.contains('dFdy(') ||
                finalWetWorld.contains('sin(')) {
            throw new GradleException(
                    'OpenMW 0.51 Android requires the GLES2-safe weather WetWorld/puddle shader.'
            )
        }

        def finalWaterShader = file('src/main/assets/libopenmw/resources/shaders/compatibility/water.frag')
                .getText('UTF-8')
        if (!finalWaterShader.contains('OPENMW_ANDROID_051_WETWORLD_WATER_MASK') ||
                !finalWaterShader.contains('#if @wetWorldWaterMask') ||
                !finalWaterShader.contains('gl_FragData[0].a = 0.0;') ||
                !finalWaterShader.contains('rainCombined(position.xy/1000.0, waterTimer)')) {
            throw new GradleException(
                    'OpenMW 0.51 Android requires exact WetWorld water exclusion while retaining native rain ripples.'
            )
        }

        def runtimePatcher = new File(project.rootDir, 'buildscripts/patches/openmw051-final/apply-android-runtime-baseline.py')
        def runtimePatcherText = runtimePatcher.isFile() ? runtimePatcher.getText('UTF-8') : ''
        if (!runtimePatcherText.contains('OPENMW_ANDROID_051_CPU_SUN_OCCLUSION') ||
                !runtimePatcherText.contains('OPENMW_ANDROID_051_POSTPROCESSING_SCENE_DEPTH') ||
                !runtimePatcherText.contains('setTextureDepth(getTexture(Tex_Depth, frameId))') ||
                !runtimePatcherText.contains('OPENMW_ANDROID_051_WETWORLD_WATER_MASK') ||
                !runtimePatcherText.contains('defineMap["wetWorldWaterMask"] = "1";') ||
                !runtimePatcherText.contains("release_log_marker = 'OpenMW 0.51 Android renderer:'") ||
                !runtimePatcherText.contains('CPU sun-occlusion diagnostic logging was not removed') ||
                !runtimePatcherText.contains('repetitive shadow diagnostic was not removed')) {
            throw new GradleException('OpenMW 0.51 Android requires the permanent renderer patches and final release-log cleanup.')
        }

        // The final release intentionally carries only the small GLSL syntax corrections
        // that are independently safe on the 0.51 shader architecture.
        def fullscreenShader = file('src/main/assets/libopenmw/resources/shaders/compatibility/fullscreen_tri.vert').getText('UTF-8')
        def shadowShader = file('src/main/assets/libopenmw/resources/shaders/compatibility/shadowcasting.vert').getText('UTF-8')
        def debugVert = file('src/main/assets/libopenmw/resources/shaders/compatibility/debug.vert').getText('UTF-8')
        def debugFrag = file('src/main/assets/libopenmw/resources/shaders/compatibility/debug.frag').getText('UTF-8')
        def shadowFragmentShader = file('src/main/assets/libopenmw/resources/shaders/compatibility/shadows_fragment.glsl').getText('UTF-8')

        if (fullscreenShader.contains('uniform vec2 scaling =') ||
                shadowShader.contains('uniform bool useDiffuseMapForShadowAlpha =') ||
                shadowShader.contains('uniform bool alphaTestShadows =') ||
                debugVert.contains('uniform bool useAdvancedShader =') ||
                debugFrag.contains('uniform bool useAdvancedShader =')) {
            throw new GradleException(
                    'OpenMW 0.51 runtime gate is missing the minimal Android/GL4ES uniform-initializer patch.\n' +
                    'Re-run tools\\build-openmw-051-runtime.ps1.'
            )
        }

        // Keep the proven Android GLES2 shadow compatibility baseline active.
        if (!shadowFragmentShader.contains('OPENMW_ANDROID_051_GLES2_MANUAL_SHADOW_COMPARE') ||
                shadowFragmentShader.contains('uniform sampler2DShadow') ||
                shadowFragmentShader.contains('shadow2DProj(') ||
                !shadowFragmentShader.contains('uniform sampler2D shadowTexture@shadow_texture_unit_index;') ||
                !shadowFragmentShader.contains('step(shadowXYZ.z, texture2D(') ||
                !shadowShader.contains('OPENMW_ANDROID_051_GLES2_NATIVE_SHADOW_CLIPPING') ||
                shadowShader.contains('gl_Position.z = clamp(gl_Position.z, -gl_Position.w, gl_Position.w);')) {
            throw new GradleException(
                    'OpenMW 0.51 Android GLES2 shadow payload is incomplete.\n' +
                    'Re-run tools\\apply-openmw-051-patch12-shadows.ps1 before assembling the APK.'
            )
        }
    }
}


// -----------------------------------------------------------------------------
// OMWFX post-processing package
// -----------------------------------------------------------------------------
// Keep third-party shader sources out of this patch ZIP itself. The first build
// downloads the upstream package once, stores the archive in project/.gradle,
// then generates an Android asset overlay. A normal `clean` removes only the
// generated copy; the cached archive remains available for offline rebuilds.
def omwfxSourceUrl =
        'https://gitlab.com/glassmancody.info/omwfx-shaders/-/archive/main/omwfx-shaders-main.zip'
def omwfxCacheDir = new File(rootProject.projectDir, '.gradle/openmw-omwfx')
def omwfxArchive = new File(omwfxCacheDir, 'omwfx-shaders-main.zip')
def omwfxGeneratedAssetsDir = new File(buildDir, 'generated/omwfxAssets')
def omwfxGeneratedVfsDir =
        new File(omwfxGeneratedAssetsDir, 'libopenmw/resources/vfs')

tasks.register('prepareOmwfxShaders') {
    group = 'openmw'
    description = 'Downloads/caches OMWFX and prepares its shaders as generated APK assets.'

    inputs.property('omwfxSourceUrl', omwfxSourceUrl)
    outputs.dir(omwfxGeneratedAssetsDir)

    doLast {
        omwfxCacheDir.mkdirs()

        def downloadArchive = {
            def tempArchive = new File(omwfxCacheDir, 'omwfx-shaders-main.zip.part')
            tempArchive.delete()

            logger.lifecycle('OpenMW: downloading OMWFX shaders (one-time cache)...')
            def connection = new URL(omwfxSourceUrl).openConnection()
            connection.setConnectTimeout(20000)
            connection.setReadTimeout(120000)
            connection.setRequestProperty('User-Agent', 'OpenMW-Android-v12')

            connection.getInputStream().withCloseable { input ->
                tempArchive.withOutputStream { output ->
                    byte[] buffer = new byte[64 * 1024]
                    int count
                    while ((count = input.read(buffer)) >= 0) {
                        if (count > 0) {
                            output.write(buffer, 0, count)
                        }
                    }
                }
            }

            if (!tempArchive.isFile() || tempArchive.length() < 1024) {
                tempArchive.delete()
                throw new GradleException(
                        'OMWFX download produced an invalid archive: ' + omwfxSourceUrl
                )
            }

            if (omwfxArchive.exists() && !omwfxArchive.delete()) {
                tempArchive.delete()
                throw new GradleException('Could not replace cached OMWFX archive: ' + omwfxArchive)
            }

            if (!tempArchive.renameTo(omwfxArchive)) {
                tempArchive.delete()
                throw new GradleException('Could not finalize cached OMWFX archive: ' + omwfxArchive)
            }
        }

        if (!omwfxArchive.isFile() || omwfxArchive.length() < 1024) {
            downloadArchive()
        }

        project.delete(omwfxGeneratedAssetsDir)
        omwfxGeneratedVfsDir.mkdirs()

        def extractArchive = {
            int extractedFiles = 0
            int extractedOmwfx = 0

            new java.util.zip.ZipInputStream(
                    new BufferedInputStream(new FileInputStream(omwfxArchive))
            ).withCloseable { zip ->
                java.util.zip.ZipEntry entry

                while ((entry = zip.nextEntry) != null) {
                    def normalized = entry.name.replace('\\', '/')
                    def shaderMarker = normalized.indexOf('/shaders/')

                    if (shaderMarker >= 0) {
                        // Strip the archive's top-level directory but retain the
                        // complete "shaders/..." tree expected by OpenMW's VFS.
                        def relative = normalized.substring(shaderMarker + 1)

                        if (!entry.isDirectory()) {
                            // Avoid duplicate asset paths when OpenMW itself
                            // already ships a shader/resource with the same name.
                            def bundledFile =
                                    file('src/main/assets/libopenmw/resources/vfs/' + relative)

                            if (!bundledFile.exists()) {
                                def destination = new File(omwfxGeneratedVfsDir, relative)
                                def canonicalRoot = omwfxGeneratedVfsDir.canonicalFile
                                def canonicalDestination = destination.canonicalFile

                                if (!canonicalDestination.path.startsWith(
                                        canonicalRoot.path + File.separator)) {
                                    throw new GradleException(
                                            'Unsafe path in OMWFX archive: ' + entry.name
                                    )
                                }

                                destination.parentFile.mkdirs()
                                destination.withOutputStream { output ->
                                    byte[] buffer = new byte[64 * 1024]
                                    int count
                                    while ((count = zip.read(buffer)) > 0) {
                                        output.write(buffer, 0, count)
                                    }
                                }

                                extractedFiles++
                                if (relative.toLowerCase(Locale.ROOT).endsWith('.omwfx')) {
                                    extractedOmwfx++
                                }
                            }
                        }
                    }

                    zip.closeEntry()
                }
            }

            if (extractedOmwfx == 0) {
                throw new GradleException(
                        'The cached OMWFX archive did not contain any usable .omwfx shaders.'
                )
            }

            def marker = new File(omwfxGeneratedVfsDir, 'omwfx-android-preset.txt')
            marker.text =
                    'OpenMW Android OMWFX preset v12\n' +
                    'Source: ' + omwfxSourceUrl + '\n' +
                    'Generated .omwfx files: ' + extractedOmwfx + '\n' +
                    'Generated total files: ' + extractedFiles + '\n'

            logger.lifecycle(
                    "OpenMW: prepared OMWFX assets (${extractedOmwfx} .omwfx files, " +
                    "${extractedFiles} total generated files)."
            )
        }

        try {
            extractArchive()
        } catch (Exception firstFailure) {
            // A stale/corrupt partial cache should never permanently poison
            // future builds. Re-download once and retry extraction.
            logger.warn('OpenMW: cached OMWFX archive is unusable; downloading it again.')
            project.delete(omwfxGeneratedAssetsDir)
            omwfxArchive.delete()
            downloadArchive()
            omwfxGeneratedVfsDir.mkdirs()
            extractArchive()
        }
    }
}

android {
    // Keep the historical source namespace for now. It controls generated R and
    // BuildConfig classes, not the installed Android package/application ID.
    // Changing it would require unrelated package/import churn across the launcher.
    namespace 'com.libopenmw.openmw'

    compileSdk 35
    ndkVersion '26.1.10909125'

    sourceSets {
        main {
            resources {
                srcDir "wrap/res"
            }

            // Do not merge the generated upstream OMWFX VFS overlay.
            // MainActivity exposes only the calibrated
            // WetWorld, Godrays, Lensflare, Bloom and RainLens assets at runtime.
        }
    }

    defaultConfig {
        // Canonical package/application ID from Phase 1 v8 onward.
        applicationId "com.ast.openmw"

        versionCode openMwVersionCode
        versionName calculateVersion()

        minSdk 21

        // Keep this at 29 for the final legacy game-file-access release.
        // Scoped-storage modernization remains a separate post-0.51 step.
        targetSdk 29

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildTypes {
        release {
            minifyEnabled false
        }

        debug {
            // Deliberately no applicationIdSuffix. Debug and release both use
            // com.ast.openmw, so Android gives both the same app-specific data path.
            debuggable true
        }
    }

    // Keep the historical Mainline task name so the existing Android Studio / CLI
    // workflow stays unchanged, but remove the obsolete Nightly flavor completely.
    flavorDimensions += "version"

    productFlavors {
        mainline {
            dimension "version"
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('verifyOpenMwPayload')
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'

    implementation project(':storagechooser')

    implementation 'com.bugsnag:bugsnag-android-ndk:4.22.3'

    testImplementation 'junit:junit:4.13.2'
}
