apply plugin: 'com.android.library'

group = 'com.github.codekidX'

android {
    namespace 'com.codekidlabs.storagechooser'
    compileSdk 35

    defaultConfig {
        minSdk 16
        targetSdk 28

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'com.google.android.material:material:1.4.0'

    androidTestImplementation('androidx.test.espresso:espresso-core:3.4.0') {
        exclude group: 'com.android.support', module: 'support-annotations'
    }

    testImplementation 'junit:junit:4.13.2'
}

// The original module contained old publication-only Javadoc tasks that used
// configurations.compile. That configuration no longer exists in modern Gradle.
// They are deliberately omitted because they are unrelated to building the app.
